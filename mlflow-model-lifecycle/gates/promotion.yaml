# Promotion policy: a challenger becomes @champion only if every check passes.
# Absolute checks always apply; relative checks apply when a champion exists and are paired
# (both models scored on the same holdout rows, bootstrap over rows).
absolute:
  min_auc: 0.72
  max_brier: 0.20
  max_ece: 0.06
  min_n_holdout: 200
relative:
  auc_noninferiority_margin: 0.01     # lower CI bound of (challenger - champion) AUC must be >= -margin
  brier_max_degradation: 0.01        # upper CI bound of (challenger - champion) Brier must be <= margin
  max_score_psi: 0.25                # decision stability: PSI between champion and challenger scores
  n_boot: 2000
  level: 0.95
slices:
  min_auc: 0.60                      # every protected slice with >= min_n rows must reach this AUC
  min_n: 30
require_same_data_snapshot: true     # both models must carry the holdout's data fingerprint
