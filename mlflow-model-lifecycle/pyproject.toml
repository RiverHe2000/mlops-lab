[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlreg"
version = "0.1.0"
description = "Credit-risk PD model lifecycle on MLflow: data contract, tracked training, model registry with aliases, statistically gated champion/challenger promotion, and auto-generated model cards."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "mlflow>=3.1",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
mlreg = "mlreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlreg = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["mlruns", "mlartifacts", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG"]
ignore = ["RUF012", "N812", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]
"scripts/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "mlflow.*",
  "sklearn.*",
  "matplotlib.*",
  "scipy.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mlreg --cov-report=term-missing -p no:cacheprovider"
markers = [
  "slow: long-running tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore::FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["mlreg"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
