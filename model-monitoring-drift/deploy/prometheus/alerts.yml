# Alert rules on the exporter's gauges. Severities mirror the policy: `for:` windows keep a
# single odd batch from paging anyone, the same idea as consecutive_windows_for_critical.
groups:
  - name: mlwatch
    rules:
      - alert: ModelMonitorStale
        expr: time() - mlwatch_last_run_timestamp_seconds > 2 * 86400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "No monitoring run for 2 days"
          description: "The scheduled monitor has not published a window since {{ $value | humanizeDuration }}."

      - alert: FeatureDriftCritical
        expr: mlwatch_feature_psi > 0.25 and mlwatch_feature_test_p_adjusted < 0.01
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Feature {{ $labels.feature }} drifted (PSI {{ $value | printf \"%.2f\" }})"

      - alert: FeatureDriftWarning
        expr: mlwatch_feature_psi > 0.10 and mlwatch_feature_test_p_adjusted < 0.01
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: "Feature {{ $labels.feature }} PSI above 0.10 for two hours"

      - alert: ScoreDistributionShift
        expr: mlwatch_score_psi > 0.25
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Score distribution moved (PSI {{ $value | printf \"%.2f\" }}) — check serving before blaming the population"

      - alert: RealisedAucBelowFloor
        expr: mlwatch_auc < 0.70 and mlwatch_window_labels >= 200
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "Realised AUC {{ $value | printf \"%.3f\" }} below the 0.70 floor — retrain recommended"

      - alert: DataQualityIssues
        expr: mlwatch_quality_issues > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} data-quality issue(s) in the last window"

      - alert: RetrainRecommended
        expr: mlwatch_window_action == 3
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "Monitor recommends retraining"
