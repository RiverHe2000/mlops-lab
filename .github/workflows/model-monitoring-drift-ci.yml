name: CI · model-monitoring-drift

on:
  push:
    branches: [main]
    paths: ["model-monitoring-drift/**", ".github/workflows/model-monitoring-drift-ci.yml"]
  pull_request:
    paths: ["model-monitoring-drift/**", ".github/workflows/model-monitoring-drift-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: model-monitoring-drift

jobs:
  quality:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: model-monitoring-drift/pyproject.toml
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml
      - name: Policy gate — the monitor must catch drift without crying wolf
        # A small version of docs/RESULTS.md: with the shipped policy, stationary traffic must
        # stay quiet and a one-sigma covariate shift must be flagged on the right feature.
        run: |
          mlwatch evaluate --policy policies/default.yaml --scenario none covariate_shift --seeds 8 --n-baseline 3000 --out runs/eval.md
          python - <<'PY'
          import json
          rows = {(r["scenario"], r["magnitude"]): r for r in json.load(open("runs/eval.json"))}
          assert rows[("none", 0.0)]["flagged_rate"] <= 0.25, rows[("none", 0.0)]
          assert rows[("covariate_shift", 1.0)]["target_hit_rate"] >= 0.75, rows[("covariate_shift", 1.0)]
          print("policy gate passed")
          PY
      - name: Validate Prometheus rules and Grafana dashboard
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.53.0 check rules /etc/prometheus/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
          python -c "import json; d=json.load(open('deploy/grafana/dashboards/mlwatch.json')); assert d['panels'], 'empty dashboard'"
      - name: Build exporter image
        run: docker build -t mlwatch:ci -f deploy/Dockerfile .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            model-monitoring-drift/coverage.xml
            model-monitoring-drift/runs/eval.md
          if-no-files-found: ignore
