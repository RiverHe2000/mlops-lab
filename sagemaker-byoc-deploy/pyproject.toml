[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smdeploy"
version = "0.1.0"
description = "Bring-your-own-container ML on AWS SageMaker: training and inference container contracts, model registry with approval, blue/green endpoint deployment with auto-rollback, autoscaling, IaC and an OIDC-secured CD pipeline - all testable offline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "River He" }]
dependencies = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "joblib>=1.4",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "moto[sagemaker,s3,ecr,sts,cloudwatch,applicationautoscaling,iam]>=5.0",
  "boto3-stubs[sagemaker,sagemaker-runtime,ecr,s3,sts,cloudwatch,application-autoscaling]",
  "cfn-lint>=1.20",
  "dockerfile-parse>=2.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
smdeploy = "smdeploy.cli:main"
smdeploy-train = "smdeploy.training:main"
smdeploy-serve = "smdeploy.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smdeploy = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG", "ASYNC"]
ignore = ["RUF012", "N812", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "joblib.*",
  "moto.*",
  "dockerfile_parse.*",
  "cfnlint.*",
  "uvicorn.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=smdeploy --cov-report=term-missing -p no:cacheprovider"
markers = [
  "slow: long-running tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore::FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["smdeploy"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
