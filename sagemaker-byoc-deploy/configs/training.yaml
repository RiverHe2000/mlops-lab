# CreateTrainingJob spec. Placeholders of the form ${...} (optionally ${...:-default}) are expanded
# from the environment by `smdeploy train-job` / `smdeploy plan`; CD sets them from CloudFormation outputs.
job_name: ${TRAINING_JOB_NAME:-credit-pd-manual}
image_uri: ${IMAGE_URI}
role_arn: ${SAGEMAKER_EXECUTION_ROLE_ARN}
instance_type: ml.m5.large
instance_count: 1
volume_gb: 10
max_runtime_s: 1800
use_spot: true                      # ~70 % cheaper; needs max_wait_s and a checkpoint prefix
max_wait_s: 3600
checkpoint_s3_uri: s3://${ARTIFACT_BUCKET}/checkpoints/${TRAINING_JOB_NAME:-credit-pd-manual}/
hyperparameters:
  target: default
  positive_label: 1
  id_columns: application_id
  model: logistic_regression
  C: 0.5
  threshold: 0.3
  seed: 42
channels:
  train:
    s3_uri: s3://${ARTIFACT_BUCKET}/data/train/
    content_type: text/csv
  validation:
    s3_uri: s3://${ARTIFACT_BUCKET}/data/validation/
    content_type: text/csv
output_s3_uri: s3://${ARTIFACT_BUCKET}/training-output/
environment:
  TRAINING_JOB_NAME: ${TRAINING_JOB_NAME:-credit-pd-manual}
tags:
  project: credit-pd
  owner: risk-modelling
